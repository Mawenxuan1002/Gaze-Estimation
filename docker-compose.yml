version: '3.8'

services:
  gaze-tracker:
    build: .
    container_name: gaze-tracker
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8081}:8081"
    volumes:
      - ./rooms.json:/app/rooms.json
      - ./outputs:/app/outputs
    environment:
      - DEMO_PORT=8081
      - API_URL=${API_URL:-http://platform.example.com:8081}
      - GAZE_USERNAME=${GAZE_USERNAME:-admin}
      - GAZE_PASSWORD=${GAZE_PASSWORD:-}
